<style>
  /* Light (latte) is the default; dark (espresso) follows the system or the switch. */
  :root {
    --bg: #f6efe4;
    --bg-glow-1: #f1dfc6;
    --bg-glow-2: #efe3d2;
    --panel: #fffaf3;
    --panel-2: #f5ebdd;
    --line: #e6d6c0;
    --text: #2b1a0f;
    --muted: #7d624a;
    --accent: #9a5a26;
    --accent-2: #b8692c;
    --accent-hi: #ad6a33;
    --accent-soft: #9a5a2622;
    --cta-text: #ffffff;
    --card-hover: #f6ead9;
    --bar: #fffaf3d9;
    --ok: #3f8f3a;
    --ceramic: #f0e4d3;
    --ceramic-shadow: #c9b89c;
    --saucer-shadow: rgba(80,50,20,.25);
    --page-bg: #f6efe4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1a120c; --bg-glow-1: #3a2515; --bg-glow-2: #2a1810;
    --panel: #2a1d14; --panel-2: #34251a; --line: #4a3424;
    --text: #f3e7d6; --muted: #b39b80;
    --accent: #d4a574; --accent-2: #c97a3c; --accent-hi: #e2b98c; --accent-soft: #d4a57426;
    --cta-text: #241509; --card-hover: #34251a; --bar: #1f150ed9; --ok: #8fd584;
    --saucer-shadow: rgba(0,0,0,.5); --page-bg: #1a120c; color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #1a120c; --bg-glow-1: #3a2515; --bg-glow-2: #2a1810;
    --panel: #2a1d14; --panel-2: #34251a; --line: #4a3424;
    --text: #f3e7d6; --muted: #b39b80;
    --accent: #d4a574; --accent-2: #c97a3c; --accent-hi: #e2b98c; --accent-soft: #d4a57426;
    --cta-text: #241509; --card-hover: #34251a; --bar: #1f150ed9; --ok: #8fd584;
    --saucer-shadow: rgba(0,0,0,.5); --page-bg: #1a120c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* rules 14, 33, 36: nothing scrolls, no overscroll bounce, no white edge */
  html { height: 100%; overflow: hidden; background: var(--page-bg); overscroll-behavior: none; }
  body {
    height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(1200px 600px at 80% -10%, var(--bg-glow-1) 0%, transparent 60%),
      radial-gradient(800px 500px at 10% 100%, var(--bg-glow-2) 0%, transparent 60%),
      var(--bg);
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; }

  /* Full-width app bar: brand, the two phases, theme switch, one CTA */
  .topbar { flex: none; padding-top: env(safe-area-inset-top); }
  .bar-in { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 18px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; }
  h1 .bean { display: inline-block; width: 10px; height: 14px; background: var(--accent); border-radius: 50%/40%; margin-right: 8px; box-shadow: inset -2px 0 0 rgba(0,0,0,.3); }
  .phases { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--panel-2); }
  .phases button { all: unset; cursor: pointer; padding: 7px 18px; border-radius: 999px; font-size: 14px; color: var(--muted); transition: background-color .15s, color .15s; }
  .phases button:hover { color: var(--text); }
  .phases button[aria-selected="true"] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .spacer { flex: 1; }
  .iconbtn { all: unset; cursor: pointer; flex: none; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; color: var(--muted); transition: background-color .15s, color .15s; }
  .iconbtn:hover { color: var(--text); background: var(--accent-soft); }
  .iconbtn:focus-visible, .cta:focus-visible, .phases button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico-sun { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ico-sun { display: block; } :root:not([data-theme="light"]) .ico-moon { display: none; } }
  :root[data-theme="dark"] .ico-sun { display: block; } :root[data-theme="dark"] .ico-moon { display: none; }
  .cta {
    flex: none; cursor: pointer; border: 0; font-size: 14px; font-weight: 600; line-height: 1;
    background: var(--accent); color: var(--cta-text); padding: 11px 18px; border-radius: 999px; white-space: nowrap;
    transition: background-color .15s, box-shadow .15s;
  }
  .cta:hover { background: var(--accent-hi); box-shadow: 0 0 0 4px var(--accent-soft); }
  .cta .short { display: none; }

  /* Two panes: the cup (the answer) and the current phase */
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 14px; padding: 4px 18px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-height: 0; position: relative; }

  /* cup pane */
  .cupside { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px; }
  .verdict { text-align: center; min-height: 64px; display: flex; flex-direction: column; justify-content: center; }
  .verdict .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .verdict .nm { font-size: 26px; font-weight: 700; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .verdict.idle .nm { color: var(--muted); font-size: 18px; font-weight: 500; }
  .verdict .away { font-size: 13px; color: var(--muted); }
  .info { all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; color: var(--muted); background: var(--panel-2); }
  .info:hover, .info[aria-expanded="true"] { color: var(--text); background: var(--accent-soft); }
  .note {
    position: absolute; left: 14px; right: 14px; top: 92px; z-index: 5;
    background: var(--bar); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .note b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .note[hidden] { display: none; }
  .empty-btn { position: absolute; top: 12px; right: 12px; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 30px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 7px; border-radius: 999px; background: var(--panel-2); font-size: 13px; white-space: nowrap; }
  .chip .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); }
  .chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .near { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .near button { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; background: var(--accent-soft); color: var(--text); }
  .near button:hover { background: var(--card-hover); }
  .near button .d { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* phase pane */
  .phase { display: none; height: 100%; flex-direction: column; gap: 14px; padding: 16px 18px; }
  .phase.on { display: flex; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { all: unset; cursor: pointer; height: 32px; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; font-size: 13.5px; color: var(--muted); background: var(--panel-2); white-space: nowrap; transition: background-color .15s, color .15s; }
  .pill:hover { color: var(--text); }
  .pill.on { color: var(--text); background: var(--accent-soft); font-weight: 600; }
  .pill .num { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--panel); color: var(--accent); }
  .pill.has .num { background: var(--accent); color: var(--cta-text); }

  /* famous coffees: tiles with a mini glass, paged (rule 36) */
  .tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: 74px; gap: 10px; align-content: start; overflow: hidden; }
  .tile { all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; background: var(--panel-2); transition: background-color .15s; min-width: 0; }
  .tile:hover { background: var(--card-hover); }
  .tile.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .tile.off { display: none; }
  .tile .nm { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .glass { flex: none; width: 30px; height: 40px; border-radius: 4px 4px 10px 10px; overflow: hidden; display: flex; flex-direction: column-reverse; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--line); padding: 2px; }
  .glass i { display: block; width: 100%; }
  .glass i:first-child { border-radius: 0 0 8px 8px; }
  .pager { display: flex; justify-content: center; gap: 8px; min-height: 10px; }
  .pager button { all: unset; cursor: pointer; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .pager button.on { background: var(--accent); }

  /* build: one stage at a time, big ingredient tiles */
  .ings { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); grid-auto-rows: minmax(84px, 112px); gap: 12px; align-content: center; }
  .ing { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px; border-radius: 14px; background: var(--panel-2); transition: background-color .15s; }
  .ing.has { background: var(--accent-soft); }
  .ing .sw { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); box-shadow: inset 0 -4px 8px rgba(0,0,0,.15); }
  .ing .nm { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qty { display: flex; align-items: center; gap: 4px; flex: none; }
  .qty button { all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--panel); color: var(--text); transition: background-color .15s; }
  .qty button:hover { background: var(--card-hover); }
  .qty button.plus { color: var(--accent); }
  .qty .n { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .qty .n.zero { color: var(--muted); font-weight: 400; }
  .stepnav { display: flex; justify-content: space-between; }
  .stepnav .pill { background: transparent; }
  .stepnav .pill:hover { background: var(--panel-2); }
  .stepnav .pill[disabled] { visibility: hidden; }

  /* one-line shared network footer */
  #scn-footer { flex: none; min-height: 34px; }

  @media (max-width: 899px) {
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 0 10px; }
    .bar-in { padding: 0 12px; gap: 8px; }
    .cupside { flex-direction: row; flex-wrap: wrap; gap: 6px 10px; padding: 10px; }
    .cupside .scene { transform: scale(.42); transform-origin: center; margin: -88px -76px; }
    .verdict { flex: 1; min-height: 0; text-align: left; }
    .verdict .nm { justify-content: flex-start; font-size: 21px; }
    .cupside .chips, .cupside .near { flex-basis: 100%; }
    .note { top: 70px; }
    .phase { padding: 12px; gap: 10px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 58px; gap: 8px; }
    .ings { grid-template-columns: minmax(0, 1fr); grid-auto-rows: 52px; gap: 7px; align-content: start; }
    .stepnav { display: none; }
    .steps { flex-wrap: nowrap; justify-content: space-between; gap: 4px; }
    .steps .pill { padding: 0 7px; }
    .empty-btn { top: 6px; right: auto; left: 6px; }
    .ing .sw { width: 28px; height: 28px; }
    .pill { height: 30px; padding: 0 11px; font-size: 13px; }
    .steps .pill .t { display: none; }
    .steps .pill.on .t { display: inline; }
  }
  @media (max-width: 520px) {
    h1 .word { display: none; }
    .phases button { padding: 7px 12px; }
    .cta .long { display: none; } .cta .short { display: inline; }
    .cta { padding: 10px 14px; }
  }
  /* ---------- the cup ---------- */
  .scene {
    position: relative;
    width: 260px; height: 300px;
    display: flex; justify-content: center; align-items: flex-end;
  }
  .saucer {
    position: absolute; bottom: 2px;
    width: 260px; height: 18px;
    background: radial-gradient(ellipse at center, var(--ceramic) 0%, var(--ceramic-shadow) 90%, transparent 100%);
    border-radius: 50%;
    box-shadow: 0 8px 18px var(--saucer-shadow);
    z-index: 0;
  }
  .cup-wrap {
    position: relative;
    width: 200px;
    height: 240px;
    margin-bottom: 10px;
    z-index: 1;
  }
  .cup {
    position: absolute; inset: 0;
    background: linear-gradient(to right, #d6c5ab 0%, var(--ceramic) 12%, #fff8ec 38%, var(--ceramic) 78%, #b8a386 100%);
    border-radius: 18px 18px 110px 110px / 18px 18px 28px 28px;
    box-shadow:
      inset 0 -10px 24px rgba(0,0,0,.18),
      inset 0 8px 0 rgba(255,255,255,.4),
      0 14px 24px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .cup-rim {
    position: absolute; top: 0; left: 0; right: 0; height: 16px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(to bottom,
      #6b4d33 0%,
      #4a3422 4px,
      #2a1c12 8px,
      transparent 16px);
    z-index: 4;
    pointer-events: none;
  }
  .liquid {
    position: absolute; left: 4px; right: 4px; bottom: 4px;
    height: 0;
    border-radius: 0 0 100px 100px / 0 0 22px 22px;
    overflow: hidden;
    display: flex; flex-direction: column-reverse;
    transition: height .35s ease;
    z-index: 2;
  }
  .layer {
    width: 100%;
    transition: height .35s ease, background .25s ease;
    position: relative;
  }
  .layer.foam {
    background:
      radial-gradient(circle at 20% 30%, #fff 0 3px, transparent 4px),
      radial-gradient(circle at 60% 60%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 80% 20%, #fff 0 3px, transparent 4px),
      radial-gradient(circle at 40% 80%, #fff 0 2px, transparent 3px),
      linear-gradient(to bottom, #fffaf0, #f3e8d3);
    background-size: 22px 22px, 16px 16px, 26px 26px, 18px 18px, 100% 100%;
  }
  .layer.whipped {
    background:
      radial-gradient(circle at 25% 40%, rgba(255,255,255,.95) 0 8px, transparent 9px),
      radial-gradient(circle at 70% 30%, rgba(255,255,255,.95) 0 10px, transparent 11px),
      radial-gradient(circle at 50% 70%, rgba(255,255,255,.95) 0 7px, transparent 8px),
      linear-gradient(to bottom, #fffefb, #f5ecd8);
    background-size: 28px 28px, 32px 32px, 24px 24px, 100% 100%;
  }
  .layer.ice {
    background:
      linear-gradient(135deg, rgba(255,255,255,.5) 0 4px, transparent 4px 12px),
      linear-gradient(45deg, rgba(255,255,255,.5) 0 4px, transparent 4px 12px),
      linear-gradient(to bottom, #d6e7f2, #b4cfdf);
    background-size: 14px 14px, 14px 14px, 100% 100%;
  }
  .layer.cocoa {
    background:
      radial-gradient(circle at 30% 50%, #2a1408 0 1px, transparent 2px),
      radial-gradient(circle at 60% 30%, #2a1408 0 1px, transparent 2px),
      radial-gradient(circle at 80% 70%, #2a1408 0 1px, transparent 2px),
      linear-gradient(to bottom, #4a2c1a, #6b3e22);
    background-size: 6px 6px, 8px 8px, 7px 7px, 100% 100%;
  }
  .layer.icecream {
    background: radial-gradient(ellipse at 30% 30%, #fff8d6 0 28px, #fff5c8 40%, #f5e6a8 100%);
    border-radius: 60% 60% 30% 30% / 70% 70% 30% 30%;
    margin-top: -10px;
  }
  .layer.sugar {
    background: linear-gradient(to bottom, rgba(255,255,255,.4), rgba(255,255,255,.1));
    box-shadow: inset 0 -2px 0 rgba(255,255,255,.6);
  }
  .cup-handle {
    position: absolute;
    right: -30px; top: 60px;
    width: 50px; height: 96px;
    border: 12px solid var(--ceramic);
    border-left-color: transparent;
    border-radius: 0 60% 60% 0 / 0 50% 50% 0;
    box-shadow: 2px 2px 6px rgba(0,0,0,.3);
    z-index: 0;
  }
  .steam {
    position: absolute; left: 50%; top: -24px; width: 60px; height: 50px;
    transform: translateX(-50%);
    pointer-events: none;
    opacity: .5;
  }
  .steam span {
    position: absolute; bottom: 0;
    width: 8px; height: 30px;
    background: linear-gradient(to top, rgba(255,255,255,.5), rgba(255,255,255,0));
    border-radius: 50%;
    animation: rise 2.4s infinite ease-in;
  }
  .steam span:nth-child(1) { left: 18px; animation-delay: 0s; }
  .steam span:nth-child(2) { left: 30px; animation-delay: .6s; }
  .steam span:nth-child(3) { left: 42px; animation-delay: 1.2s; }
  @keyframes rise {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    30% { opacity: .7; }
    100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
  }
</style>

<body>
<header class="topbar">
  <div class="bar-in">
    <h1><span class="bean"></span><span class="word">Coffee Lab</span></h1>
    <nav class="phases" role="tablist" aria-label="Mode">
      <button role="tab" data-phase="pick" aria-selected="true">Pick</button>
      <button role="tab" data-phase="build" aria-selected="false">Build</button>
    </nav>
    <div class="spacer"></div>
    <button class="iconbtn" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme"><svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
    <button class="cta" id="randomBtn" type="button"><span class="long">Pour a random coffee</span><span class="short">Random</span></button>
  </div>
</header>

<main class="main">
  <!-- the answer: what's in the cup -->
  <section class="card cupside">

<script>
/* ============================================================

   ============================================================ */

  milk_foam:          { name: "Milk foam",         stage: "foam",      color: "#fffaf0", density: 9, klass: "foam" },

/* ============================================================

   ============================================================ */
const STAGES = [
  { id: "base",      title: "Base",         hint: "the coffee itself" },
  { id: "water",     title: "Water & ice",  hint: "dilute or chill" },
  { id: "milk",      title: "Milk",         hint: "dairy or plant" },
  { id: "sweetener", title: "Sweetener",    hint: "sugar or syrup" },
  { id: "spirit",    title: "Spirit",       hint: "a measure" },
  { id: "foam",      title: "Foam & top",   hint: "the finish" },
  { id: "dust",      title: "Dust",         hint: "garnish" },
];

/* ============================================================
   FAMOUS COFFEES — recipe is { ingredientId: parts }, 1 part ≈ 30 ml
   ============================================================ */
const COFFEES = [
  { id: "espresso",     name: "Espresso",        family: "Pure espresso",   recipe: { espresso: 1 },                                                      notes: "A single 30 ml shot pulled in 25–30 s. The foundation of every Italian café drink." },
  { id: "doppio",       name: "Doppio",          family: "Pure espresso",   recipe: { espresso: 2 },                                                      notes: "Two espresso shots in one cup. \"Double\" in Italian." },
  { id: "ristretto",    name: "Ristretto",       family: "Pure espresso",   recipe: { ristretto: 1 },                                                     notes: "A \"restricted\" pull — same ground coffee, less water. More syrupy and less bitter than a normal shot." },

  { id: "americano",    name: "Americano",       family: "With water",      recipe: { espresso: 1, hot_water: 3 },                                        notes: "Espresso lengthened with hot water. Folklore says US soldiers in WWII asked Italian baristas to dilute their espresso." },
  { id: "long_black",   name: "Long Black",      family: "With water",      recipe: { espresso: 2, hot_water: 2 },                                        notes: "Antipodean reverse of an Americano — hot water first, then the shots poured on top. Keeps the crema intact." },

  { id: "macchiato",    name: "Macchiato",       family: "Milk-forward",    recipe: { espresso: 1, milk_foam: 1 },                                        notes: "Espresso \"marked\" (macchiato) with just a dollop of milk foam." },
  { id: "cortado",      name: "Cortado",         family: "Milk-forward",    recipe: { espresso: 1, steamed_milk: 1 },                                     notes: "Equal parts espresso and steamed milk. Spanish for \"cut\"." },
  { id: "flat_white",   name: "Flat White",      family: "Milk-forward",    recipe: { espresso: 2, steamed_milk: 4 },                                     notes: "Antipodean specialty: double espresso under velvety microfoam, no thick foam cap." },
  { id: "cappuccino",   name: "Cappuccino",      family: "Milk-forward",    recipe: { espresso: 1, steamed_milk: 2, milk_foam: 2 },                       notes: "Equal thirds of espresso, steamed milk, and milk foam. Named after the brown hood of Capuchin monks." },
  { id: "latte",        name: "Latte",           family: "Milk-forward",    recipe: { espresso: 1, steamed_milk: 5, milk_foam: 1 },                       notes: "Mostly steamed milk over an espresso, with a thin foam cap." },

  { id: "mocha",        name: "Café Mocha",      family: "Sweet & rich",    recipe: { chocolate: 1, espresso: 1, steamed_milk: 4, whipped_cream: 1 },     notes: "Espresso with chocolate syrup and steamed milk, often crowned with whipped cream." },
  { id: "vienna",       name: "Vienna",          family: "Sweet & rich",    recipe: { espresso: 2, whipped_cream: 2, cocoa: 1 },                          notes: "Two shots topped with mountains of whipped cream and a dusting of cocoa. The Wiener Melange's richer cousin." },
  { id: "cubano",       name: "Café Cubano",     family: "Sweet & rich",    recipe: { sugar: 1, espresso: 1 },                                            notes: "Espresso pulled directly onto sugar and whipped into an \"espuma\". Fiercely sweet." },
  { id: "vanilla_latte",name: "Vanilla Latte",   family: "Sweet & rich",    recipe: { vanilla_syrup: 1, espresso: 1, steamed_milk: 5, milk_foam: 1 },     notes: "Latte sweetened with vanilla syrup." },
  { id: "caramel_macc", name: "Caramel Macchiato",family:"Sweet & rich",    recipe: { vanilla_syrup: 1, steamed_milk: 4, espresso: 1, caramel_syrup: 1, milk_foam: 1 }, notes: "Vanilla-sweetened milk, espresso \"marked\" on top, then a caramel drizzle. A Starbucks classic." },

  { id: "oat_latte",    name: "Oat Latte",       family: "Alt milk",        recipe: { espresso: 1, oat_milk: 5, milk_foam: 1 },                           notes: "Latte made with oat milk. The default plant-milk in third-wave cafés — steams to a silky microfoam." },
  { id: "almond_latte", name: "Almond Latte",    family: "Alt milk",        recipe: { espresso: 1, almond_milk: 5, milk_foam: 1 },                       notes: "Latte made with almond milk. Nutty, slightly thinner texture than oat." },
  { id: "soy_latte",    name: "Soy Latte",       family: "Alt milk",        recipe: { espresso: 1, soy_milk: 5, milk_foam: 1 },                           notes: "Latte with soy milk — the original specialty alt-milk." },
  { id: "pistachio_latte",name:"Pistachio Latte",family: "Alt milk",        recipe: { espresso: 1, pistachio_oat_milk: 5, milk_foam: 1 },                 notes: "Latte with sweet pistachio-oat milk. A 2020s flavor-bar staple." },

  { id: "affogato",     name: "Affogato",        family: "With ice cream",  recipe: { espresso: 2, ice_cream: 2 },                                        notes: "A scoop of vanilla ice cream \"drowned\" (affogato) in hot espresso. Dessert and coffee in one cup." },

  { id: "iced_latte",   name: "Iced Latte",      family: "Iced",            recipe: { espresso: 1, cold_milk: 4, ice: 3 },                                notes: "Espresso poured over cold milk and ice." },
  { id: "iced_americano",name:"Iced Americano",  family: "Iced",            recipe: { espresso: 1, cold_water: 3, ice: 3 },                               notes: "Espresso over cold water and ice. Brisk and clean." },
  { id: "cold_brew",    name: "Cold Brew",       family: "Iced",            recipe: { cold_brew: 4 },                                                     notes: "Coffee steeped in cold water for 12–24 hours. Mellow, low-acid, no espresso machine needed." },

  { id: "irish",        name: "Irish Coffee",    family: "Spirited",        recipe: { espresso: 2, whisky: 1, sugar: 1, whipped_cream: 2 },               notes: "Hot coffee with Irish whiskey, sweetened, with a layer of cream floated on top. Invented at Foynes Airport, Ireland in 1943." },
];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  cup: {},
  activeFamily: "All",
};

const CAPACITY = 10;

/* ============================================================
   HELPERS
   ============================================================ */
function shortIngLabel(id) {
  return INGREDIENTS[id].name.split(" ")[0].toLowerCase();
}
function recipeInline(recipe) {
  return Object.entries(recipe).map(([id, n]) => `${n}× ${shortIngLabel(id)}`).join(" + ");
}
function totalParts() {
  return Object.values(state.cup).reduce((s, n) => s + n, 0);
}

function findMatch() {
  const cupIds = Object.keys(state.cup).filter(k => state.cup[k] > 0);
  if (cupIds.length === 0) return null;
  for (const c of COFFEES) {
    const recipeIds = Object.keys(c.recipe);
    if (recipeIds.length !== cupIds.length) continue;
    let match = true;
    for (const id of recipeIds) {
      if (state.cup[id] !== c.recipe[id]) { match = false; break; }
    }
    if (match) return c;
  }
  return null;
}

function closestDrinks(n = 3) {
  const ranked = COFFEES.map(c => {
    const allKeys = new Set([...Object.keys(c.recipe), ...Object.keys(state.cup)]);
    let dist = 0;
    for (const k of allKeys) dist += Math.abs((c.recipe[k] || 0) - (state.cup[k] || 0));
    return { c, dist };
  }).sort((a, b) => a.dist - b.dist);
  return ranked.slice(0, n);
}

/* ============================================================
   UI STATE — one phase and one build step on screen at a time
   ============================================================ */
const ui = { phase: "pick", step: 0, page: 0, noteOpen: false };
const $ = id => document.getElementById(id);
const stagesInUse = STAGES.filter(s => Object.values(INGREDIENTS).some(i => i.stage === s.id));
const byDensity = entries => entries.sort((a, b) => INGREDIENTS[a[0]].density - INGREDIENTS[b[0]].density);

const shortName = id => { const n = INGREDIENTS[id].name; return n.length <= 12 ? n : n.split(" ")[0]; };

/* a recipe drawn as stacked colour bands in a small glass */
function glass(recipe) {
  const entries = byDensity(Object.entries(recipe));
  const total = entries.reduce((s, [, n]) => s + n, 0);
  return `<span class="glass" aria-hidden="true">${entries.map(([id, n]) =>
    `<i style="height:${(n / total) * 100}%;background:${INGREDIENTS[id].color}"></i>`).join("")}</span>`;
}

/* ============================================================
   PICK — family pills + drink tiles, paged to fit (no scrolling)
   ============================================================ */
function renderFamilies() {
  const families = ["All", ...new Set(COFFEES.map(c => c.family))];
  const root = $("families");
  root.innerHTML = families.map(f =>
    `<button class="pill${f === state.activeFamily ? " on" : ""}" data-fam="${f}">${f}</button>`).join("");
  root.onclick = e => {
    const b = e.target.closest("[data-fam]"); if (!b) return;
    state.activeFamily = b.dataset.fam; ui.page = 0; renderFamilies(); renderDrinks();
  };
}

function renderDrinks() {
  const root = $("drinks");
  const list = state.activeFamily === "All" ? COFFEES : COFFEES.filter(c => c.family === state.activeFamily);
  const match = findMatch();
  root.innerHTML = list.map(c =>
    `<button class="tile${match && match.id === c.id ? " on" : ""}" data-id="${c.id}" title="${c.name}">${glass(c.recipe)}<span class="nm">${c.name}</span></button>`).join("");
  root.onclick = e => {
    const t = e.target.closest("[data-id]"); if (!t) return;
    state.cup = { ...COFFEES.find(c => c.id === t.dataset.id).recipe }; ui.noteOpen = false; render();
  };
  paginate();
}

function paginate() {
  const root = $("drinks"), tiles = [...root.children], pager = $("pager");
  tiles.forEach(t => t.classList.remove("off"));
  pager.innerHTML = "";
  if (!tiles.length || !root.offsetParent) return;
  const cs = getComputedStyle(root);
  const cols = cs.gridTemplateColumns.split(" ").length;
  const rowH = tiles[0].getBoundingClientRect().height, gap = parseFloat(cs.rowGap) || 0;
  const rows = Math.max(1, Math.floor((root.clientHeight + gap) / (rowH + gap)));
  const per = cols * rows, pages = Math.ceil(tiles.length / per);
  ui.page = Math.min(ui.page, pages - 1);
  tiles.forEach((t, i) => t.classList.toggle("off", Math.floor(i / per) !== ui.page));
  if (pages > 1) pager.innerHTML = Array.from({ length: pages }, (_, i) =>
    `<button class="${i === ui.page ? "on" : ""}" data-page="${i}" aria-label="Page ${i + 1}"></button>`).join("");
}
$("pager").onclick = e => { const b = e.target.closest("[data-page]"); if (b) { ui.page = +b.dataset.page; paginate(); } };
function turnPage(d) {
  const pages = $("pager").children.length || 1;
  const p = ui.page + d; if (p < 0 || p >= pages) return; ui.page = p; paginate();
}

/* ============================================================
   BUILD — step pills, one stage's ingredients, back / next
   ============================================================ */
function stageHas(stage) { return Object.keys(state.cup).some(id => INGREDIENTS[id].stage === stage.id && state.cup[id] > 0); }

function renderBuild() {
  $("steps").innerHTML = stagesInUse.map((s, i) =>
    `<button class="pill${i === ui.step ? " on" : ""}${stageHas(s) ? " has" : ""}" data-step="${i}"><span class="num">${i + 1}</span><span class="t">${s.title}</span></button>`).join("");
  const stage = stagesInUse[ui.step];
  const ids = Object.keys(INGREDIENTS).filter(id => INGREDIENTS[id].stage === stage.id);
  $("ings").innerHTML = ids.map(id => {
    const ing = INGREDIENTS[id], n = state.cup[id] || 0;
    return `<div class="ing${n ? " has" : ""}"><span class="sw" style="background:${ing.color}"></span><span class="nm">${ing.name}</span>
      <span class="qty"><button class="minus" data-id="${id}" data-delta="-1" aria-label="Less ${ing.name}">−</button><span class="n${n ? "" : " zero"}">${n}</span><button class="plus" data-id="${id}" data-delta="1" aria-label="More ${ing.name}">+</button></span></div>`;
  }).join("");
  const prev = stagesInUse[ui.step - 1], next = stagesInUse[ui.step + 1];
  $("prevStep").disabled = !prev; $("prevStep").textContent = prev ? prev.title : "";
  $("nextStep").disabled = !next; $("nextStep").textContent = next ? next.title : "";
}
$("steps").onclick = e => { const b = e.target.closest("[data-step]"); if (b) { ui.step = +b.dataset.step; renderBuild(); } };
$("prevStep").onclick = () => goStep(-1);
$("nextStep").onclick = () => goStep(1);
function goStep(d) { const s = ui.step + d; if (s < 0 || s >= stagesInUse.length) return; ui.step = s; renderBuild(); }
$("ings").onclick = e => {
  const btn = e.target.closest("button[data-id]"); if (!btn) return;
  const id = btn.dataset.id, next = (state.cup[id] || 0) + parseInt(btn.dataset.delta, 10);
  if (next <= 0) delete state.cup[id]; else state.cup[id] = Math.min(next, 9);
  ui.noteOpen = false; render();
};

/* ============================================================
   CUP — liquid, verdict, recipe chips, nearest drinks
   ============================================================ */
function renderLiquid() {
  const liquid = $("liquid");
  liquid.innerHTML = "";
  const entries = Object.entries(state.cup).filter(([, n]) => n > 0);
  const total = entries.reduce((s, [, n]) => s + n, 0);
  if (total === 0) { liquid.style.height = "0"; $("steam").style.opacity = "0"; return; }
  byDensity(entries);
  liquid.style.height = (Math.min(total / CAPACITY, 1) * 100) + "%";
  for (const [id, parts] of entries) {
    const ing = INGREDIENTS[id];
    const layer = document.createElement("div");
    layer.className = "layer" + (ing.klass ? " " + ing.klass : "");
    layer.style.height = ((parts / total) * 100) + "%";
    if (!ing.klass) layer.style.background = ing.color;
    liquid.appendChild(layer);
  }
  const hasHot = ["espresso","ristretto","steamed_milk","hot_water","whisky"].some(k => state.cup[k]);
  const hasCold = ["ice","cold_milk","cold_water","cold_brew"].some(k => state.cup[k]);
  $("steam").style.opacity = (hasHot && !hasCold) ? ".5" : "0";
}

function renderCupInfo() {
  const match = findMatch(), total = totalParts(), v = $("verdict"), note = $("note");
  if (match) {
    v.className = "verdict";
    v.innerHTML = `<span class="lbl">You made</span><span class="nm">${match.name}<button class="info" id="infoBtn" aria-expanded="${ui.noteOpen}" aria-label="About ${match.name}">i</button></span>`;
    note.innerHTML = `<b>${match.family}</b>${match.notes}`;
  } else if (total === 0) {
    v.className = "verdict idle";
    v.innerHTML = `<span class="nm">Empty cup</span>`;
  } else {
    const { c, dist } = closestDrinks(1)[0];
    v.className = "verdict";
    v.innerHTML = `<span class="lbl">Closest</span><span class="nm">${c.name}</span><span class="away">${dist} step${dist === 1 ? "" : "s"} away</span>`;
  }
  note.hidden = !(match && ui.noteOpen);
  const info = $("infoBtn");
  if (info) info.onclick = () => { ui.noteOpen = !ui.noteOpen; renderCupInfo(); };

  const entries = byDensity(Object.entries(state.cup).filter(([, n]) => n > 0)).reverse();
  $("recipe").innerHTML = entries.map(([id, n]) =>
    `<span class="chip" title="${INGREDIENTS[id].name} · ${n * 30} ml"><span class="sw" style="background:${INGREDIENTS[id].color}"></span>${shortName(id)}<span class="n">×${n}</span></span>`).join("");

  // in progress: tap a near drink to pour it
  $("near").innerHTML = (!match && total) ? closestDrinks(3).map(({ c, dist }) =>
    `<button data-id="${c.id}">${c.name}<span class="d">${dist}</span></button>`).join("") : "";
}
$("near").onclick = e => {
  const b = e.target.closest("[data-id]"); if (!b) return;
  state.cup = { ...COFFEES.find(c => c.id === b.dataset.id).recipe }; render();
};

/* ============================================================
   PHASES + RENDER
   ============================================================ */
function setPhase(p) {
  ui.phase = p;
  document.querySelectorAll(".phases [data-phase]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.phase === p)));
  document.querySelectorAll(".phase").forEach(el => el.classList.toggle("on", el.dataset.phase === p));
  if (p === "pick") paginate(); else renderBuild();
}
document.querySelector(".phases").onclick = e => { const b = e.target.closest("[data-phase]"); if (b) setPhase(b.dataset.phase); };

function render() {
  renderDrinks();
  renderBuild();
  renderLiquid();
  renderCupInfo();
}

$("clearBtn").onclick = () => { state.cup = {}; ui.noteOpen = false; render(); };

/* App-bar CTA: pour a random famous coffee (never the one already in the cup) */
$("randomBtn").onclick = () => {
  const current = findMatch();
  const pool = COFFEES.filter(c => !current || c.id !== current.id);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  state.cup = { ...pick.recipe }; ui.noteOpen = false;
  if (state.activeFamily !== "All" && state.activeFamily !== pick.family) { state.activeFamily = pick.family; ui.page = 0; renderFamilies(); }
  render();
  const tile = document.querySelector(`.tile[data-id="${pick.id}"]`);
  if (tile && tile.classList.contains("off")) { // jump to the page that shows it
    const idx = [...$("drinks").children].indexOf(tile), per = [...$("drinks").children].filter(t => !t.classList.contains("off")).length;
    ui.page = Math.floor(idx / per); paginate();
  }
};

/* keys: ↑/↓ turn pages (Pick) · ←/→ move between steps (Build) · Esc closes the note */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && ui.noteOpen) { ui.noteOpen = false; renderCupInfo(); return; }
  if (ui.phase === "pick" && (e.key === "ArrowDown" || e.key === "PageDown")) { e.preventDefault(); turnPage(1); }
  else if (ui.phase === "pick" && (e.key === "ArrowUp" || e.key === "PageUp")) { e.preventDefault(); turnPage(-1); }
  else if (ui.phase === "build" && e.key === "ArrowRight") goStep(1);
  else if (ui.phase === "build" && e.key === "ArrowLeft") goStep(-1);
});
let wheelLock = 0;
$("drinks").addEventListener("wheel", e => {
  e.preventDefault();
  if (Math.abs(e.deltaY) < 20 || Date.now() < wheelLock) return;
  wheelLock = Date.now() + 500; turnPage(e.deltaY > 0 ? 1 : -1);
}, { passive: false });
addEventListener("resize", paginate);

  var b=document.getElementById("theme-toggle");if(!b)return;
