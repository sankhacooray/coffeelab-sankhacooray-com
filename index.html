<style>
  /* Light (latte) is the default; dark (espresso) follows the system or the switch. */
  :root {
    --bg: #f6efe4;
    --bg-glow-1: #f1dfc6;
    --bg-glow-2: #efe3d2;
    --panel: #fffaf3;
    --panel-2: #f5ebdd;
    --line: #e6d6c0;
    --text: #2b1a0f;
    --muted: #7d624a;
    --accent: #9a5a26;
    --accent-2: #b8692c;
    --accent-hi: #ad6a33;
    --accent-soft: #9a5a2622;
    --cta-text: #ffffff;
    --card-hover: #f6ead9;
    --bar: #fffaf3d9;
    --ok: #3f8f3a;
    --ceramic: #f0e4d3;
    --ceramic-shadow: #c9b89c;
    --saucer-shadow: rgba(80,50,20,.25);
    --page-bg: #f6efe4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1a120c; --bg-glow-1: #3a2515; --bg-glow-2: #2a1810;
    --panel: #2a1d14; --panel-2: #34251a; --line: #4a3424;
    --text: #f3e7d6; --muted: #b39b80;
    --accent: #d4a574; --accent-2: #c97a3c; --accent-hi: #e2b98c; --accent-soft: #d4a57426;
    --cta-text: #241509; --card-hover: #34251a; --bar: #1f150ed9; --ok: #8fd584;
    --saucer-shadow: rgba(0,0,0,.5); --page-bg: #1a120c; color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #1a120c; --bg-glow-1: #3a2515; --bg-glow-2: #2a1810;
    --panel: #2a1d14; --panel-2: #34251a; --line: #4a3424;
    --text: #f3e7d6; --muted: #b39b80;
    --accent: #d4a574; --accent-2: #c97a3c; --accent-hi: #e2b98c; --accent-soft: #d4a57426;
    --cta-text: #241509; --card-hover: #34251a; --bar: #1f150ed9; --ok: #8fd584;
    --saucer-shadow: rgba(0,0,0,.5); --page-bg: #1a120c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* rules 14, 33, 36: nothing scrolls, no overscroll bounce, no white edge */
  html { height: 100%; overflow: hidden; background: var(--page-bg); overscroll-behavior: none; }
  body {
    height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(1200px 600px at 80% -10%, var(--bg-glow-1) 0%, transparent 60%),
      radial-gradient(800px 500px at 10% 100%, var(--bg-glow-2) 0%, transparent 60%),
      var(--bg);
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; }

  /* Full-width app bar: brand, the two phases, theme switch, one CTA */
  .topbar { flex: none; padding-top: env(safe-area-inset-top); }
  .bar-in { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 18px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; }
  h1 .bean { display: inline-block; width: 10px; height: 14px; background: var(--accent); border-radius: 50%/40%; margin-right: 8px; box-shadow: inset -2px 0 0 rgba(0,0,0,.3); }
  .phases { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--panel-2); }
  .phases button { all: unset; cursor: pointer; padding: 7px 18px; border-radius: 999px; font-size: 14px; color: var(--muted); transition: background-color .15s, color .15s; }
  .phases button:hover { color: var(--text); }
  .phases button[aria-selected="true"] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  /* search: one field in the app bar, results float below it */
  .search { position: relative; flex: 1; max-width: 460px; margin: 0 auto; display: flex; align-items: center; }
  .search .s-ico { position: absolute; left: 13px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; height: 40px; border: 0; border-radius: 999px; padding: 0 16px 0 38px; font: inherit; font-size: 14px; color: var(--text); background: var(--panel-2); outline: none; }
  .search input:focus { box-shadow: 0 0 0 2px var(--accent); background: var(--panel); }
  .search input::-webkit-search-cancel-button { cursor: pointer; }
  .results { position: absolute; top: 48px; left: 0; right: 0; z-index: 30; padding: 6px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--bar); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 16px 40px rgba(0,0,0,.22); display: flex; flex-direction: column; gap: 2px; }
  .results[hidden] { display: none; }
  .res { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; }
  .res:hover, .res.sel { background: var(--accent-soft); }
  .res .nm { flex: 1; font-size: 14px; font-weight: 600; line-height: 1.2; }
  .res .sw { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); margin: 0 4px; }
  .res .glass { width: 22px; height: 30px; padding: 1.5px; }
  .kind { flex: none; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; }
  .kind.drink { background: var(--accent-soft); color: var(--accent); }
  .kind.ing { background: var(--panel-2); color: var(--muted); }
  .res-empty { padding: 10px 12px; color: var(--muted); font-size: 13.5px; }
  .iconbtn.search-open { display: none; }
  .ing.flash { box-shadow: inset 0 0 0 2px var(--accent); }
  .iconbtn { all: unset; cursor: pointer; flex: none; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; color: var(--muted); transition: background-color .15s, color .15s; }
  .iconbtn:hover { color: var(--text); background: var(--accent-soft); }
  .iconbtn:focus-visible, .cta:focus-visible, .phases button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico-sun { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ico-sun { display: block; } :root:not([data-theme="light"]) .ico-moon { display: none; } }
  :root[data-theme="dark"] .ico-sun { display: block; } :root[data-theme="dark"] .ico-moon { display: none; }
  .cta {
    flex: none; cursor: pointer; border: 0; font-size: 14px; font-weight: 600; line-height: 1;
    background: var(--accent); color: var(--cta-text); padding: 11px 18px; border-radius: 999px; white-space: nowrap;
    transition: background-color .15s, box-shadow .15s;
  }
  .cta:hover { background: var(--accent-hi); box-shadow: 0 0 0 4px var(--accent-soft); }
  .cta .short { display: none; }

  /* Two panes: the cup (the answer) and the current phase */
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 14px; padding: 4px 18px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-height: 0; position: relative; }

  /* cup pane */
  .cupside { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; padding: 30px 18px 14px; }
  /* fixed height: the cup never moves when the verdict gains or loses a line */
  .verdict { flex: none; text-align: center; height: 74px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
  .verdict .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .verdict .nm { font-size: 26px; font-weight: 700; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .verdict.idle .nm { color: var(--muted); font-size: 18px; font-weight: 500; }
  .verdict .away { font-size: 13px; color: var(--muted); }
  .info { all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; color: var(--muted); background: var(--panel-2); }
  .info:hover, .info[aria-expanded="true"] { color: var(--text); background: var(--accent-soft); }
  .note {
    position: absolute; left: 14px; right: 14px; top: 92px; z-index: 5;
    background: var(--bar); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .note b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .note[hidden] { display: none; }
  .empty-btn { position: absolute; top: 12px; right: 12px; }

  /* what's in the cup, top layer first, with rough volumes (1 part ≈ 30 ml) */
  .vols { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 3px; }
  .vrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 62px; align-items: center; gap: 9px; min-height: 28px; padding: 0 10px; border-radius: 8px; font-size: 13.5px; }
  .vrow .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); }
  .vrow .nm { line-height: 1.2; }
  .vrow .ml { color: var(--muted); font-variant-numeric: tabular-nums; }
  .vrow.total { background: var(--panel-2); font-weight: 600; margin-top: 3px; }
  .vrow.total .ml { color: var(--accent); }
  .near { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .near button { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; background: var(--accent-soft); color: var(--text); }
  .near button:hover { background: var(--card-hover); }
  .near button .d { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* phase pane */
  .phase { display: none; height: 100%; flex-direction: column; gap: 14px; padding: 16px 18px; }
  .phase.on { display: flex; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { all: unset; cursor: pointer; height: 32px; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; font-size: 13.5px; color: var(--muted); background: var(--panel-2); white-space: nowrap; transition: background-color .15s, color .15s; }
  .pill:hover { color: var(--text); }
  .pill.on { color: var(--text); background: var(--accent-soft); font-weight: 600; }
  .pill .num { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--panel); color: var(--accent); }
  .pill.has .num { background: var(--accent); color: var(--cta-text); }

  /* famous coffees: tiles with a mini glass, paged (rule 36) */
  .tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: 74px; gap: 10px; align-content: start; overflow: hidden; }
  .tile { all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; background: var(--panel-2); transition: background-color .15s; min-width: 0; }
  .tile:hover { background: var(--card-hover); }
  .tile.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .tile.off { display: none; }
  .tile .nm { font-size: 14.5px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .glass { flex: none; width: 30px; height: 40px; border-radius: 4px 4px 10px 10px; overflow: hidden; display: flex; flex-direction: column-reverse; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--line); padding: 2px; }
  .glass i { display: block; width: 100%; }
  .glass i:first-child { border-radius: 0 0 8px 8px; }
  .pager { display: flex; justify-content: center; gap: 8px; min-height: 10px; }
  .pager button { all: unset; cursor: pointer; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .pager button.on { background: var(--accent); }

  /* build: one stage at a time, big ingredient tiles */
  .ings { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); grid-auto-rows: minmax(84px, 112px); gap: 12px; align-content: center; overflow: hidden; }
  .ing.off { display: none; }
  .ing { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px; border-radius: 14px; background: var(--panel-2); transition: background-color .15s; }
  .ing.has { background: var(--accent-soft); }
  .ing .sw { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); box-shadow: inset 0 -4px 8px rgba(0,0,0,.15); }
  .ing .nm { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; line-height: 1.2; }
  .qty { display: flex; align-items: center; gap: 4px; flex: none; }
  .qty button { all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--panel); color: var(--text); transition: background-color .15s; }
  .qty button:hover { background: var(--card-hover); }
  .qty button.plus { color: var(--accent); }
  .qty .n { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .qty .n.zero { color: var(--muted); font-weight: 400; }
  .stepnav { display: flex; justify-content: space-between; }
  .stepnav .pill { background: transparent; }
  .stepnav .pill:hover { background: var(--panel-2); }
  .stepnav .pill[disabled] { visibility: hidden; }

  @media (min-width: 900px) and (max-height: 660px) {
    .cupside .scene { transform: scale(.7) !important; margin-bottom: -70px !important; }
  }
  @media (min-width: 900px) and (max-height: 760px) {
    .cupside .scene { transform: scale(.8); transform-origin: top center; margin-bottom: -38px; }
  }
  /* glasses for iced drinks: clear sides, no handle, no saucer */
  .cup-wrap.glass .cup { background: linear-gradient(to right, rgba(255,255,255,.35), rgba(255,255,255,.08) 30%, rgba(255,255,255,.05) 70%, rgba(255,255,255,.3)); box-shadow: inset 0 0 0 2px rgba(160,190,210,.55), 0 10px 20px rgba(0,0,0,.15); border-radius: 6px 6px 22px 22px / 6px 6px 14px 14px; }
  .cup-wrap.glass .cup-rim, .cup-wrap.glass .cup-handle { display: none; }
  .scene.glassy .saucer { opacity: 0; }
  .saucer { transition: opacity .3s, width .35s; }
  .cupname { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .scene { margin-bottom: 18px; }

  /* temperatures and clashes */
  .vrow .tmp { font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .tmp.hot { color: #c2502e; } .tmp.warm { color: #b8862c; } .tmp.cold { color: #3b82b8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tmp.hot { color: #f08a5d; } :root:not([data-theme="light"]) .tmp.cold { color: #7fb8e6; } }
  :root[data-theme="dark"] .tmp.hot { color: #f08a5d; } :root[data-theme="dark"] .tmp.cold { color: #7fb8e6; }
  .flag { color: #c98a12; font-weight: 700; margin-left: 4px; cursor: help; }
  .ing .nm small { display: block; font-size: 12px; font-weight: 500; color: #b5780c; margin-top: 2px; }
  .ing.clash { box-shadow: inset 0 0 0 1.5px rgba(201,138,18,.55); }

  /* brew guide: floats over the cup pane */
  .brew-btn { all: unset; cursor: pointer; position: absolute; top: 14px; left: 14px; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--panel-2); color: var(--text); display: inline-flex; align-items: center; gap: 6px; z-index: 6; }
  .brew-btn:hover, .brew-btn[aria-expanded="true"] { background: var(--accent-soft); }
  .brew-btn[hidden] { display: none; }
  .brew { position: absolute; inset: 52px 12px auto; max-height: calc(100% - 64px); z-index: 5; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--bar); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 16px 40px rgba(0,0,0,.2); display: flex; flex-direction: column; gap: 6px; }
  .brew[hidden] { display: none; }
  .brew ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .brew li { display: grid; grid-template-columns: 22px 16px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 30px; font-size: 13.5px; line-height: 1.25; }
  .brew li .k { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--panel-2); color: var(--accent); }
  .brew li .sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); }
  .brew li .tmp { font-size: 12px; }
  .brew li.serve { margin-top: 4px; padding: 4px 0; border-radius: 8px; background: var(--panel-2); font-weight: 600; }

  /* one-line shared network footer */
  /* reserve the footer's final height so nothing jumps when its script arrives */
  #scn-footer { flex: none; min-height: 56px; }
  @media (max-width: 899px) { #scn-footer { min-height: 52px; } }

  @media (max-width: 899px) {
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 0 10px; }
    .bar-in { padding: 0 12px; gap: 8px; }
    .cupside { flex-direction: row; flex-wrap: wrap; gap: 6px 10px; padding: 10px; }
    .cupside .scene { transform: scale(.42); transform-origin: center; margin: -88px -76px; }
    .verdict { flex: 1; height: 74px; text-align: left; }
    .cupside { align-items: flex-start; }
    .cupside .scene { align-self: center; }
    .verdict .nm { justify-content: flex-start; font-size: 21px; }
    .cupside .vols, .cupside .near { flex-basis: 100%; }
    .vols { max-width: none; gap: 1px; }
    .vrow { min-height: 24px; font-size: 13px; padding: 1px 8px; }
    .note { top: 70px; }
    .phase { padding: 12px; gap: 10px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 58px; gap: 8px; }
    .ings { grid-template-columns: minmax(0, 1fr); grid-auto-rows: 52px; gap: 7px; align-content: start; }
    .stepnav { display: none; }
    .steps { flex-wrap: nowrap; justify-content: space-between; gap: 4px; }
    .steps .pill { padding: 0 7px; }
    .empty-btn { top: 6px; right: auto; left: 6px; }
    .brew-btn { top: 9px; left: 46px; }
    .cupside { padding-top: 40px; }
    .brew { inset: 46px 8px auto; max-height: calc(100% - 54px); }
    .cupname { display: none; }
    .cupside .scene { margin-bottom: -88px; }
    .ing .sw { width: 28px; height: 28px; }
    .pill { height: 30px; padding: 0 11px; font-size: 13px; }
    .steps .pill .t { display: none; }
    .steps .pill.on .t { display: inline; }
  }
  @media (max-width: 760px) {
    .search { display: none; }
    .iconbtn.search-open { display: grid; margin-left: auto; }
    .topbar.searching .search { display: flex; position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); max-width: none; z-index: 40; }
    .topbar.searching .search input { height: 40px; box-shadow: 0 0 0 2px var(--accent); background: var(--panel); }
    .topbar { position: relative; }
  }

  /* ---------- the cup ---------- */
  .scene {
    position: relative;

  .cup-wrap {
    --w: 200px; --h: 240px;

    height: var(--h);

  .cup {

  .cup-rim {
    position: absolute; top: 0; left: 0; right: 0; height: 16px;
    border-radius: 16px 16px 0 0;

      #4a3422 4px,
      #2a1c12 8px,

  }
  .liquid {
    position: absolute; left: 4px; right: 4px; bottom: 4px;

    display: flex; flex-direction: column-reverse;
    transition: height .35s ease;
    z-index: 2;
  }
  .layer {
    width: 100%;
    transition: height .35s ease, background .25s ease;
    position: relative;
  }
  .layer.foam {
    background:
      radial-gradient(circle at 20% 30%, #fff 0 3px, transparent 4px),
      radial-gradient(circle at 60% 60%, #fff 0 2px, transparent 3px),

<script>

const STAGES = [

];

/* ============================================================
   FAMOUS COFFEES — recipe is { ingredientId: parts }, 1 part ≈ 30 ml
   ============================================================ */
const COFFEES = [
  { id: "espresso",     name: "Espresso",        family: "Pure espresso",   recipe: { espresso: 1 },                                                      notes: "A single 30 ml shot pulled in 25–30 s. The foundation of every Italian café drink." },
  { id: "doppio",       name: "Doppio",          family: "Pure espresso",   recipe: { espresso: 2 },                                                      notes: "Two espresso shots in one cup. \"Double\" in Italian." },
  { id: "ristretto",    name: "Ristretto",       family: "Pure espresso",   recipe: { ristretto: 1 },                                                     notes: "A \"restricted\" pull — same ground coffee, less water. More syrupy and less bitter than a normal shot." },

  { id: "americano",    name: "Americano",       family: "With water",      recipe: { espresso: 1, hot_water: 3 },                                        notes: "Espresso lengthened with hot water. Folklore says US soldiers in WWII asked Italian baristas to dilute their espresso." },
  { id: "long_black",   name: "Long Black",      family: "With water",      recipe: { espresso: 2, hot_water: 2 },                                        notes: "Antipodean reverse of an Americano — hot water first, then the shots poured on top. Keeps the crema intact." },

  { id: "macchiato",    name: "Macchiato",       family: "Milk-forward",    recipe: { espresso: 1, milk_foam: 1 },                                        notes: "Espresso \"marked\" (macchiato) with just a dollop of milk foam." },

  { id: "flat_white",   name: "Flat White",      family: "Milk-forward",    recipe: { espresso: 2, steamed_milk: 4 },                                     notes: "Antipodean specialty: double espresso under velvety microfoam, no thick foam cap." },
  { id: "cappuccino",   name: "Cappuccino",      family: "Milk-forward",    recipe: { espresso: 1, steamed_milk: 2, milk_foam: 2 },                       notes: "Equal thirds of espresso, steamed milk, and milk foam. Named after the brown hood of Capuchin monks." },
  { id: "latte",        name: "Latte",           family: "Milk-forward",    recipe: { espresso: 1, steamed_milk: 5, milk_foam: 1 },                       notes: "Mostly steamed milk over an espresso, with a thin foam cap." },

  { id: "mocha",        name: "Café Mocha",      family: "Sweet & rich",    recipe: { chocolate: 1, espresso: 1, steamed_milk: 4, whipped_cream: 1 },     notes: "Espresso with chocolate syrup and steamed milk, often crowned with whipped cream." },
  { id: "vienna",       name: "Vienna",          family: "Sweet & rich",    recipe: { espresso: 2, whipped_cream: 2, cocoa: 1 },                          notes: "Two shots topped with mountains of whipped cream and a dusting of cocoa. The Wiener Melange's richer cousin." },
  { id: "cubano",       name: "Café Cubano",     family: "Sweet & rich",    recipe: { sugar: 1, espresso: 1 },                                            notes: "Espresso pulled directly onto sugar and whipped into an \"espuma\". Fiercely sweet." },

  { id: "iced_americano",name:"Iced Americano",  family: "Iced",            recipe: { espresso: 1, cold_water: 3, ice: 3 },                               notes: "Espresso over cold water and ice. Brisk and clean." },
  { id: "cold_brew",    name: "Cold Brew",       family: "Iced",            recipe: { cold_brew: 4 },                                                     notes: "Coffee steeped in cold water for 12–24 hours. Mellow, low-acid, no espresso machine needed." },

];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  cup: {},
  activeFamily: "All",
};

const CAPACITY = 10;

/* ============================================================
   HELPERS
   ============================================================ */
function shortIngLabel(id) {
  return INGREDIENTS[id].name.split(" ")[0].toLowerCase();
}
function recipeInline(recipe) {
  return Object.entries(recipe).map(([id, n]) => `${n}× ${shortIngLabel(id)}`).join(" + ");
}
function totalParts() {
  return Object.values(state.cup).reduce((s, n) => s + n, 0);
}

function findMatch() {
  const cupIds = Object.keys(state.cup).filter(k => state.cup[k] > 0);
  if (cupIds.length === 0) return null;
  for (const c of COFFEES) {
    const recipeIds = Object.keys(c.recipe);
    if (recipeIds.length !== cupIds.length) continue;
    let match = true;
    for (const id of recipeIds) {
      if (state.cup[id] !== c.recipe[id]) { match = false; break; }
    }
    if (match) return c;
  }
  return null;
}

function closestDrinks(n = 3) {
  const ranked = COFFEES.map(c => {
    const allKeys = new Set([...Object.keys(c.recipe), ...Object.keys(state.cup)]);
    let dist = 0;
    for (const k of allKeys) dist += Math.abs((c.recipe[k] || 0) - (state.cup[k] || 0));
    return { c, dist };
  }).sort((a, b) => a.dist - b.dist);
  return ranked.slice(0, n);
}

/* ============================================================
   UI STATE — one phase and one build step on screen at a time
   ============================================================ */
const ui = { phase: "pick", step: 0, page: 0, ingPage: 0, noteOpen: false };
const $ = id => document.getElementById(id);
const stagesInUse = STAGES.filter(s => Object.values(INGREDIENTS).some(i => i.stage === s.id));
const byDensity = entries => entries.sort((a, b) => INGREDIENTS[a[0]].density - INGREDIENTS[b[0]].density);

const shortName = id => { const n = INGREDIENTS[id].name; return n.length <= 12 ? n : n.split(" ")[0]; };

/* ============================================================
   CUPS — standard sizes; the smallest that holds the drink is used
   ============================================================ */
const CUPS = [
  { name: "Espresso cup",   ml: 90,  w: 112, h: 96,  glass: false },
  { name: "Cappuccino cup", ml: 180, w: 160, h: 150, glass: false },
  { name: "Latte mug",      ml: 300, w: 200, h: 220, glass: false },
  { name: "Large mug",      ml: 450, w: 220, h: 268, glass: false },
  { name: "Tall glass",     ml: 360, w: 150, h: 250, glass: true },
  { name: "Large glass",    ml: 480, w: 170, h: 280, glass: true },
];

/* ============================================================
   TEMPERATURE + BREWING — rough home-barista numbers, °C
   ============================================================ */
const HOT_PREP = ["hot_water", "steamed_milk", "milk_foam"];
const COLD = ["ice", "cold_water", "cold_milk", "cold_brew"];
const MILKS = Object.keys(INGREDIENTS).filter(id => INGREDIENTS[id].stage === "milk");
const BASES = ["espresso", "ristretto", "cold_brew"];
const SYRUPS = ["chocolate", "vanilla_syrup", "caramel_syrup"];
const has = (cup, ids) => ids.some(id => cup[id] > 0);
const isIced = cup => has(cup, COLD);
// typical serving temperature of each famous coffee
const SERVE = {
  espresso: [65, 70], doppio: [65, 70], ristretto: [65, 70], americano: [70, 75], long_black: [70, 75],
  macchiato: [60, 65], cortado: [60, 65], flat_white: [60, 65], cappuccino: [60, 65], latte: [60, 65],
  mocha: [60, 65], vienna: [55, 60], cubano: [65, 70], vanilla_latte: [60, 65], caramel_macc: [60, 65],
  oat_latte: [55, 60], almond_latte: [50, 55], soy_latte: [55, 60], pistachio_latte: [55, 60],

// how warm each ingredient is when it reaches the cup (ice counts colder: it melts)

  return { milk_foam: iced ? [4] : [60, 65], hot_water: [80, 90], cold_water: [8], cold_milk: [4], ice: [0], cold_brew: [4],

  const parts = e.reduce((s, [, n]) => s + n, 0);

/* an ingredient that doesn't suit what's already in the cup (still allowed) */

  if (COLD.includes(id) && has(cup, HOT_PREP)) return "Cold in a hot drink";
  if (BASES.includes(id) && has(cup, BASES.filter(b => b !== id))) return "Already has a base";
  if (MILKS.includes(id) && has(cup, MILKS.filter(m => m !== id))) return "Already has a milk";
  if (id === "ice_cream" && has(cup, ["steamed_milk", "hot_water"])) return "Melts in hot liquid";
  if ((id === "steamed_milk" || id === "hot_water") && cup.ice_cream) return "Melts the ice cream";

/* ordered steps to make what's in the cup */

  const add = (id, text, r) => S.push({ id, text, r });
  const sweet = ["sugar", ...SYRUPS].filter(id => cup[id]);
  if (sweet.length) add(sweet[0], `Add ${sweet.map(name).join(" and ")} to the cup`);
  if (cup.ice) add("ice", "Fill the glass with ice", [0]);
  if (cup.ice_cream) add("ice_cream", "Add a scoop of vanilla ice cream", [-12]);
  if (cup.cold_brew) add("cold_brew", `Pour ${ml("cold_brew")} ml cold brew, steeped 12–24 h`, [4]);
  for (const b of ["espresso", "ristretto"]) if (cup[b])
    add(b, `Pull ${cup[b]} ${b === "espresso" ? "shot" : "ristretto"}${cup[b] > 1 ? "s" : ""}, ${b === "espresso" ? "25–30" : "15–20"} s`, [90, 96]);
  if (cup.hot_water) add("hot_water", `Add ${ml("hot_water")} ml hot water`, [80, 90]);

      <li class="serve"><span class="k">✓</span><span></span><span>Serve ${tWord(s.mid).toLowerCase()}</span><span class="tmp ${tCls(s.mid)}">${s.est ? "≈ " : ""}${tFmt(s.r)}</span></li></ol>`; }

$("brewBtn").onclick = () => { ui.brewOpen = !ui.brewOpen; if (ui.brewOpen) ui.noteOpen = false; renderCupInfo(); };
$("near").onclick = e => {

/* ============================================================
   SEARCH — coffees and ingredients by keyword
   ============================================================ */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function searchAll(q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const score = (name, extra) => {
    const n = norm(name), xt = norm(extra).split(/[^a-z0-9]+/);
    let s = 0;
    for (const w of words) {
      if (n.startsWith(w) || n.includes(" " + w)) s += 3;
      else if (n.includes(w)) s += 2;
      else if (xt.some(tok => tok.startsWith(w))) s += 1;   // keywords match whole-word prefixes only
      else return 0;                       // every word must match somewhere
    }
    return s;
  };
  const drinks = COFFEES.map(c => ({ kind: "drink", item: c,
    s: score(c.name, c.family + " " + Object.keys(c.recipe).map(id => INGREDIENTS[id].name).join(" ") + " " + c.notes) }));
  const ings = Object.entries(INGREDIENTS).map(([id, i]) => ({ kind: "ing", id, item: i,
    s: score(i.name, (STAGES.find(s => s.id === i.stage) || {}).title || "") }));
  return [...drinks, ...ings].filter(r => r.s).sort((a, b) => b.s - a.s || (a.kind === "drink" ? -1 : 1)).slice(0, 8);
}

  box.innerHTML = hits.length ? hits.map((h, i) => h.kind === "drink"
      ? `<button class="res${i === sel ? " sel" : ""}" data-i="${i}" role="option">${glass(h.item.recipe)}<span class="nm">${h.item.name}</span><span class="kind drink">Drink</span></button>`
      : `<button class="res${i === sel ? " sel" : ""}" data-i="${i}" role="option"><span class="sw" style="background:${h.item.color}"></span><span class="nm">${h.item.name}</span><span class="kind ing">Ingredient</span></button>`).join("")

}
function choose(h) {

    setPhase("pick"); render();
    const tiles = [...$("drinks").children], idx = tiles.findIndex(t => t.dataset.id === h.item.id);
    const per = tiles.filter(t => !t.classList.contains("off")).length || 1;

  } else {

function openSearch() { $("q").closest(".topbar").classList.add("searching"); $("q").focus(); $("q").select(); }

/* keys: ↑/↓ turn pages (Pick) · ←/→ move between steps (Build) · Esc closes the note */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); openSearch(); return; }
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
